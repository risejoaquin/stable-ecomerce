    <link rel="preconnect" href="https://dporfgsbwsyqzmlnqrug.supabase.co" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- POST-UX C HOTFIX 13: non-blocking brand fonts -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&display=swap">
    <link id="selfcare-brand-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&display=swap" media="print">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&display=swap"></noscript>
    <script src="/brand-fonts-loader.js" defer></script>
    <title>Selfcare Sinners</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // POST-UX C HOTFIX 11: early PDP product discovery
      (() => {
        const match = window.location.pathname.match(/^\/product\/([0-9a-f-]{36})(?:\/|$)/i);
        if (!match) return;

        const id = match[1];
        const promise = fetch(`/api/products/${encodeURIComponent(id)}`, {
          method: 'GET',
          headers: { Accept: 'application/json' },
          credentials: 'same-origin'
        }).then(async (response) => {
          if (!response.ok) {
            throw new Error(`Early product fetch failed with HTTP ${response.status}`);
          }
          return response.json();
        }).then((product) => {
          try {
            const imageUrl = Array.isArray(product?.images) ? product.images[0] : null;
            if (imageUrl && !document.querySelector('link[data-selfcare-pdp-lcp-preload]')) {
              const preload = document.createElement('link');
              preload.rel = 'preload';
              preload.as = 'image';
              preload.href = imageUrl;
              preload.fetchPriority = 'high';
              preload.setAttribute('data-selfcare-pdp-lcp-preload', 'true');

              const match = imageUrl.match(/^(.*\/responsive\/[^/]+\/w(\d+)\/)(\d+)\.webp(?:\?.*)?$/);
              if (match) {
                const base = match[1];
                const sourceWidth = Number(match[2]);
                const widths = [480, 800, 1200].filter((width) => width <= sourceWidth);
                if (widths.length > 0) {
                  preload.imageSrcset = widths.map((width) => base + width + '.webp ' + width + 'w').join(', ');
                  preload.imageSizes = '(max-width: 768px) 100vw, 50vw';
                }
              }

              document.head.appendChild(preload);
            }
          } catch (_) {
            // Early preload is opportunistic; React remains the source of truth.
          }
          return product;
        });

        // Keep the original rejecting promise for React Query while marking it handled
        // until the application attaches its consumer.
        promise.catch(() => {});

        window.__SELFCARE_EARLY_PRODUCT__ = {
          id,
          promise,
          startedAt: performance.now()
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
