name: Selfcare Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: TypeScript
        id: lint
        run: npm run lint

      - name: Unit tests
        id: unit_tests
        run: npm test

      - name: Build
        id: build
        run: npm run build

      - name: Secret scan
        id: secret_scan
        shell: pwsh
        run: .\scripts\qa\security\scan-local-secrets.ps1

      - name: Core regression contracts
        id: core_regression
        shell: pwsh
        run: .\scripts\qa\regression\validate-regression-core.ps1

      - name: Security baseline report
        id: security_baseline
        shell: pwsh
        run: .\scripts\qa\security\validate-security-baseline.ps1 -Mode Report

      - name: Generate PL20 Quality Step Evidence
        if: always()
        shell: pwsh
        env:
          LINT_OUTCOME: ${{ steps.lint.conclusion }}
          BUILD_OUTCOME: ${{ steps.build.conclusion }}
          UNIT_TESTS_OUTCOME: ${{ steps.unit_tests.conclusion }}
          SECRET_SCAN_OUTCOME: ${{ steps.secret_scan.conclusion }}
          CORE_REGRESSION_OUTCOME: ${{ steps.core_regression.conclusion }}
          SECURITY_BASELINE_OUTCOME: ${{ steps.security_baseline.conclusion }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path pl20-evidence | Out-Null

          function Map-Status($conclusion) {
            if ($conclusion -eq 'success') { return 'PASS' }
            if ($conclusion -eq 'skipped' -or [string]::IsNullOrWhiteSpace($conclusion)) { return 'NOT_MEASURED' }
            return 'FAIL'
          }

          $buildStatus = Map-Status $env:BUILD_OUTCOME
          $unitStatus = Map-Status $env:UNIT_TESTS_OUTCOME
          $secretStatus = Map-Status $env:SECRET_SCAN_OUTCOME
          $coreStatus = Map-Status $env:CORE_REGRESSION_OUTCOME
          $baselineStatus = Map-Status $env:SECURITY_BASELINE_OUTCOME

          $allPassed = ($buildStatus -eq 'PASS' -and $unitStatus -eq 'PASS' -and $secretStatus -eq 'PASS' -and $coreStatus -eq 'PASS' -and $baselineStatus -eq 'PASS')
          $jobStatus = if ($allPassed) { 'PASS' } else { 'FAIL' }
          $jobConclusion = if ($allPassed) { 'success' } else { 'failure' }

          $qualityData = [ordered]@{
            repository       = $env:REPO
            workflow_name    = $env:WORKFLOW
            workflow_run_id  = [int64]$env:RUN_ID
            workflow_attempt = [int]$env:RUN_ATTEMPT
            head_sha         = $env:HEAD_SHA
            job_status       = $jobStatus
            job_conclusion   = $jobConclusion
            dimensions       = [ordered]@{
              build             = [ordered]@{
                status     = $buildStatus
                step_name  = 'Build'
                conclusion = $env:BUILD_OUTCOME
              }
              unit_tests        = [ordered]@{
                status     = $unitStatus
                step_name  = 'Unit tests'
                conclusion = $env:UNIT_TESTS_OUTCOME
              }
              secret_scan       = [ordered]@{
                status     = $secretStatus
                step_name  = 'Secret scan'
                conclusion = $env:SECRET_SCAN_OUTCOME
              }
              core_regression   = [ordered]@{
                status     = $coreStatus
                step_name  = 'Core regression contracts'
                conclusion = $env:CORE_REGRESSION_OUTCOME
              }
              security_baseline = [ordered]@{
                status     = $baselineStatus
                step_name  = 'Security baseline report'
                conclusion = $env:SECURITY_BASELINE_OUTCOME
              }
            }
          }

          $qualityData | ConvertTo-Json -Depth 10 | Set-Content -Path "pl20-evidence/quality.json" -Encoding UTF8

      - name: Upload PL20 Quality Step Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pl20-evidence-quality-steps-${{ github.run_id }}-${{ github.run_attempt }}
          path: pl20-evidence/quality.json
          retention-days: 30

  e2e:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        id: build
        run: npm run build

      - name: Install Playwright Chromium
        id: playwright_install
        run: npx playwright install chromium

      - name: Playwright E2E
        id: e2e
        run: npm run test:e2e

      - name: Generate PL20 E2E Evidence
        if: always()
        shell: pwsh
        env:
          E2E_OUTCOME: ${{ steps.e2e.conclusion }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path pl20-evidence | Out-Null

          $status = if ($env:E2E_OUTCOME -eq 'success') { 'PASS' } elseif ($env:E2E_OUTCOME -eq 'skipped' -or [string]::IsNullOrWhiteSpace($env:E2E_OUTCOME)) { 'NOT_MEASURED' } else { 'FAIL' }
          $conclusion = if ($status -eq 'PASS') { 'success' } else { 'failure' }

          $e2eManifest = [ordered]@{
            schema_version    = 'pl20-ci-evidence-v1'
            repository        = $env:REPO
            workflow_name     = $env:WORKFLOW
            workflow_run_id   = [int64]$env:RUN_ID
            workflow_attempt  = [int]$env:RUN_ATTEMPT
            event             = $env:EVENT_NAME
            head_sha          = $env:HEAD_SHA
            started_at        = [DateTime]::UtcNow.ToString("o")
            completed_at      = [DateTime]::UtcNow.ToString("o")
            conclusion        = $conclusion
            dimension         = 'e2e'
            status            = $status
            test_command      = 'npm run test:e2e'
            browser           = 'chromium'
            base_url          = 'http://localhost:3000'
            server_command    = 'npm run start'
            external_services = 'mocked_or_not_required'
            caveats           = @()
          }

          $e2eManifest | ConvertTo-Json -Depth 10 | Set-Content -Path "pl20-evidence/e2e.json" -Encoding UTF8

      - name: Upload PL20 E2E Evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pl20-evidence-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: pl20-evidence/e2e.json
          retention-days: 30

  aggregate:
    needs: [quality, e2e]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Download Quality Step Evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pl20-evidence-quality-steps-${{ github.run_id }}-${{ github.run_attempt }}
          path: pl20-evidence/quality

      - name: Download E2E Evidence
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pl20-evidence-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: pl20-evidence/e2e

      - name: Generate Final Aggregate Quality Gate Evidence
        shell: pwsh
        env:
          QUALITY_JOB_RESULT: ${{ needs.quality.result }}
          E2E_JOB_RESULT: ${{ needs.e2e.result }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          New-Item -ItemType Directory -Force -Path pl20-evidence | Out-Null

          $qResult = $env:QUALITY_JOB_RESULT
          $eResult = $env:E2E_JOB_RESULT

          $qualityFile = "pl20-evidence/quality/quality.json"
          $e2eFile = "pl20-evidence/e2e/e2e.json"

          $qualityData = $null
          if (Test-Path $qualityFile) {
            $qualityData = Get-Content $qualityFile -Raw | ConvertFrom-Json
          }

          $e2eData = $null
          if (Test-Path $e2eFile) {
            $e2eData = Get-Content $e2eFile -Raw | ConvertFrom-Json
          }

          # Release gate status determination:
          # release_gate PASS only if:
          # needs.quality.result == success AND needs.e2e.result == success
          # If e2e fails: release_gate = FAIL
          # If e2e skipped/not measured: release_gate = NOT_MEASURED or FAIL, never PASS
          $releaseGateStatus = 'FAIL'
          $releaseGateConclusion = 'failure'

          if ($qResult -eq 'success' -and $eResult -eq 'success') {
            $releaseGateStatus = 'PASS'
            $releaseGateConclusion = 'success'
          } elseif ($eResult -eq 'skipped' -or $qResult -eq 'skipped') {
            $releaseGateStatus = 'NOT_MEASURED'
            $releaseGateConclusion = 'skipped'
          } else {
            $releaseGateStatus = 'FAIL'
            $releaseGateConclusion = 'failure'
          }

          $buildDim = if ($qualityData -and $qualityData.dimensions.build) { $qualityData.dimensions.build } else { [ordered]@{ status = if ($qResult -eq 'success') { 'PASS' } else { 'FAIL' }; step_name = 'Build'; conclusion = $qResult } }
          $unitDim = if ($qualityData -and $qualityData.dimensions.unit_tests) { $qualityData.dimensions.unit_tests } else { [ordered]@{ status = if ($qResult -eq 'success') { 'PASS' } else { 'FAIL' }; step_name = 'Unit tests'; conclusion = $qResult } }
          $secretDim = if ($qualityData -and $qualityData.dimensions.secret_scan) { $qualityData.dimensions.secret_scan } else { [ordered]@{ status = if ($qResult -eq 'success') { 'PASS' } else { 'FAIL' }; step_name = 'Secret scan'; conclusion = $qResult } }
          $coreDim = if ($qualityData -and $qualityData.dimensions.core_regression) { $qualityData.dimensions.core_regression } else { [ordered]@{ status = if ($qResult -eq 'success') { 'PASS' } else { 'FAIL' }; step_name = 'Core regression contracts'; conclusion = $qResult } }
          $baselineDim = if ($qualityData -and $qualityData.dimensions.security_baseline) { $qualityData.dimensions.security_baseline } else { [ordered]@{ status = if ($qResult -eq 'success') { 'PASS' } else { 'FAIL' }; step_name = 'Security baseline report'; conclusion = $qResult } }
          $e2eDim = [ordered]@{
            status     = if ($e2eData -and $e2eData.status) { $e2eData.status } elseif ($eResult -eq 'success') { 'PASS' } elseif ($eResult -eq 'skipped') { 'NOT_MEASURED' } else { 'FAIL' }
            step_name  = 'Playwright E2E'
            conclusion = $eResult
          }

          $manifest = [ordered]@{
            schema_version   = 'pl20-ci-evidence-v1'
            repository       = $env:REPO
            workflow_name    = $env:WORKFLOW
            workflow_run_id  = [int64]$env:RUN_ID
            workflow_attempt = [int]$env:RUN_ATTEMPT
            workflow_job     = 'aggregate'
            event            = $env:EVENT_NAME
            head_sha         = $env:HEAD_SHA
            started_at       = [DateTime]::UtcNow.ToString("o")
            completed_at     = [DateTime]::UtcNow.ToString("o")
            conclusion       = $releaseGateConclusion
            aggregate        = $true
            job_results      = [ordered]@{
              quality = $qResult
              e2e     = $eResult
            }
            dimensions       = [ordered]@{
              release_gate      = [ordered]@{
                status     = $releaseGateStatus
                step_name  = 'quality+e2e aggregate'
                conclusion = $releaseGateConclusion
              }
              build             = $buildDim
              unit_tests        = $unitDim
              secret_scan       = $secretDim
              core_regression   = $coreDim
              security_baseline = $baselineDim
              e2e               = $e2eDim
            }
          }

          $manifest | ConvertTo-Json -Depth 10 | Set-Content -Path "pl20-evidence/quality-gate.json" -Encoding UTF8

      - name: Upload Final PL20 Quality Gate Evidence
        uses: actions/upload-artifact@v7
        with:
          name: pl20-evidence-quality-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: pl20-evidence/quality-gate.json
          retention-days: 30
